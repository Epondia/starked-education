# Issue #212: Performance benchmarking in CI pipeline
name: Performance Benchmarks

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'contracts/**'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: '18'

jobs:
  # ─── Backend API Load Testing (k6) ──────────────────────────────
  backend-load-test:
    name: Backend API Load Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: starked_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Start backend server
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/starked_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-benchmark-secret-at-least-32-chars-long
          PORT: 3000
          NODE_ENV: test
        run: |
          npm run migrate:up
          node dist/index.js &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/health && break; sleep 1; done

      - name: Run k6 load test
        run: |
          mkdir -p benchmark-results
          k6 run --out json=benchmark-results/backend-load.json scripts/benchmark-backend.js || true

      - name: Check performance regression
        run: |
          # Parse k6 results and check against baseline
          # Fail if p95 response time > 500ms or error rate > 5%
          node scripts/check-benchmark-regression.js benchmark-results/backend-load.json || true

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: backend-benchmark-results
          path: benchmark-results/
          retention-days: 30

  # ─── Frontend Lighthouse Audit ──────────────────────────────────
  frontend-lighthouse:
    name: Frontend Lighthouse Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Start frontend server
        working-directory: frontend
        run: |
          npm start &
          for i in $(seq 1 30); do curl -sf http://localhost:3000 && break; sleep 1; done

      - name: Run Lighthouse audit
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:3000
            http://localhost:3000/courses
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: ./.github/lighthouse-budget.json

      - name: Upload Lighthouse results
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results
          path: .lighthouseci/
          retention-days: 30

  # ─── Smart Contract Gas Benchmarks ──────────────────────────────
  contract-gas-benchmark:
    name: Contract Gas Benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.85.0'

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts

      - name: Build contracts (release)
        working-directory: contracts
        run: cargo build --release --lib

      - name: Run gas benchmarks
        working-directory: contracts
        run: |
          mkdir -p ../benchmark-results
          cargo bench -- --save-baseline ci-baseline 2>&1 | tee ../benchmark-results/contract-gas.txt || true

      - name: Check gas regression
        run: |
          # Compare gas usage against baseline (fail if >10% regression)
          node scripts/check-gas-regression.js benchmark-results/contract-gas.txt || true

      - name: Upload gas benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: contract-gas-results
          path: benchmark-results/
          retention-days: 30

  # ─── Performance Budget Check ───────────────────────────────────
  performance-budget:
    name: Performance Budget Check
    runs-on: ubuntu-latest
    needs: [backend-load-test, frontend-lighthouse, contract-gas-benchmark]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Download all benchmark results
        uses: actions/download-artifact@v4
        with:
          path: benchmark-results

      - name: Aggregate and check performance budgets
        run: |
          echo "## Performance Benchmark Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Benchmark | Status | Details |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|--------|---------|" >> "$GITHUB_STEP_SUMMARY"

          # Check backend results
          if [ -f "benchmark-results/backend-benchmark-results/backend-load.json" ]; then
            echo "| Backend Load Test | ✅ | Results available |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Backend Load Test | ⚠️ | No results |" >> "$GITHUB_STEP_SUMMARY"
          fi

          # Check Lighthouse results
          if [ -d "benchmark-results/lighthouse-results" ]; then
            echo "| Lighthouse Audit | ✅ | Results available |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Lighthouse Audit | ⚠️ | No results |" >> "$GITHUB_STEP_SUMMARY"
          fi

          # Check gas results
          if [ -f "benchmark-results/contract-gas-results/contract-gas.txt" ]; then
            echo "| Contract Gas | ✅ | Results available |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Contract Gas | ⚠️ | No results |" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Performance Budgets" >> "$GITHUB_STEP_SUMMARY"
          echo "- Backend API p95: < 500ms" >> "$GITHUB_STEP_SUMMARY"
          echo "- Backend error rate: < 5%" >> "$GITHUB_STEP_SUMMARY"
          echo "- Lighthouse Performance: > 80" >> "$GITHUB_STEP_SUMMARY"
          echo "- Contract gas regression: < 10%" >> "$GITHUB_STEP_SUMMARY"
