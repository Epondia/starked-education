[package]
name = "starked-education-contracts"
version = "0.1.0"
edition = "2021"
description = "StarkEd smart contracts for decentralized credential verification on Stellar"
authors = ["jobbykings"]
license = "MIT"
repository = "https://github.com/jobbykings/starked-education"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
# `alloc` is opt-in in soroban-sdk (there is no `default` feature), and the SDK
# only installs its `#[global_allocator]` behind that feature. Without it the
# `wasm32-unknown-unknown` build fails with "no global memory allocator found",
# so the deployable .wasm artifact can never be produced.
soroban-sdk = { version = "20.5.0", features = ["alloc"] }

[dev-dependencies]
soroban-sdk = { version = "20.5.0", features = ["testutils"] }
serde_json = "1.0"

[features]
testutils = ["soroban-sdk/testutils"]

[[example]]
name = "bench_gas"
required-features = ["testutils"]
